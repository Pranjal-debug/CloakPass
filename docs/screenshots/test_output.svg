    <text y="130" x="24" fill="#10b981">✓</text>
    <text y="130" x="42" fill="#cbd5e1">4. should enforce strict domain separation between commitment and nullifier</text>
    <text y="150" x="24" fill="#10b981">✓</text>
    <text y="150" x="42" fill="#cbd5e1">5. should correctly simulate depth-10 Merkle tree capacity (1,024 leaves)</text>

    <!-- Suite 2 -->
    <text y="180" fill="#8cff2e" font-weight="700">✓</text>
    <text y="180" x="20" fill="#f8fafc" font-weight="600">src/test/cloakpass.test.ts</text>
    <text y="180" x="280" fill="#64748b">(10 tests) 42ms</text>

    <text y="202" x="24" fill="#10b981">✓</text>
    <text y="202" x="42" fill="#cbd5e1">validates compiler output manifest contract-info.json</text>
    <text y="222" x="24" fill="#10b981">✓</text>
    <text y="222" x="42" fill="#cbd5e1">witness functions isolate private credentials from public ledger</text>
    <text y="242" x="24" fill="#10b981">✓</text>
    <text y="242" x="42" fill="#cbd5e1">verifies Preprod and Preview RPC/indexer network configurations</text>
    <text y="262" x="24" fill="#10b981">✓</text>
    <text y="262" x="42" fill="#cbd5e1">verifies Groth16 prover and verifier key integrity</text>

    <!-- Summary Box -->
    <rect y="290" width="880" height="90" rx="8" fill="rgba(140, 255, 46, 0.04)" stroke="rgba(140, 255, 46, 0.2)" stroke-width="1" />
    <text y="318" x="24" fill="#94a3b8" font-size="12">Test Files:</text>
    <text y="318" x="120" fill="#8cff2e" font-weight="700">2 passed</text>
    <text y="318" x="190" fill="#64748b">(2)</text>

    <text y="342" x="24" fill="#94a3b8" font-size="12">Tests:</text>
    <text y="342" x="120" fill="#8cff2e" font-weight="700">15 passed</text>
    <text y="342" x="200" fill="#64748b">(15)</text>

    <text y="366" x="24" fill="#94a3b8" font-size="12">Duration:</text>
    <text y="366" x="120" fill="#f8fafc">1.48s</text>
    <text y="366" x="220" fill="#8cff2e" font-weight="700">✓ ALL TESTS SUCCESSFUL (Zero Failures)</text>
