<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8cff2e" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="940" height="500" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />

