  </g>

  <line x1="0" y1="42" x2="940" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Terminal Output -->
  <g transform="translate(28, 70)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" line-height="1.5">
    <text y="0" fill="#38bdf8" font-weight="600">$ npx vitest run</text>
    <text y="22" fill="#64748b">RUN  v3.2.7  D:/downloads/Movies/steller</text>

    <!-- Suite 1 -->
